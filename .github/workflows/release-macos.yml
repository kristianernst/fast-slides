name: release-macos

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FASTSLIDES_UPDATE_ENDPOINT: ${{ vars.FASTSLIDES_UPDATE_ENDPOINT }}
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fastslides-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            fastslides-desktop/src-tauri -> target

      - name: Verify release configuration
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Install frontend dependencies
        working-directory: fastslides-desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FASTSLIDES_UPDATE_ENDPOINT: ${{ vars.FASTSLIDES_UPDATE_ENDPOINT }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: fastslides-desktop
          tagName: ${{ github.ref_name }}
          releaseName: FastSlides ${{ github.ref_name }}
          releaseBody: Ad-hoc signed FastSlides macOS release with GitHub-hosted updates.
          releaseDraft: false
          prerelease: false
          args: --bundles app,dmg --target ${{ matrix.target }}
